<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Detection Fix</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background: #000; color: #fff; font-family: sans-serif; }
    /* 隱藏原生 video，改畫在 Canvas 上 */
    #webcam-video { display: none; }
    #canvas { width: 100vw; max-width: 400px; height: auto; border-bottom: 2px solid #333; }
    #status { padding: 10px; font-size: 15px; color: #00ffcc; text-align: center; }
    #start-btn { width: 80%; padding: 15px; font-size: 18px; background-color: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; margin: 20px 0; cursor: pointer; }
  </style>
</head>
<body>

  <button id="start-btn">開啟相機與姿勢偵測</button>
  <div id="status">請點擊上方按鈕</div>
  
  <!-- 原生 Video 標籤，設定 playsinline 與 muted -->
  <video id="webcam-video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script type="text/javascript">
    // ⚠️ 替換為你的 Teachable Machine 模型網址 (必須包含結尾斜線 /)
    const URL = "https://teachablemachine.withgoogle.com/models/9GH08O2__/";

    let model, video, canvas, ctx, maxPredictions;
    let lastSentPrediction = "";

    const startBtn = document.getElementById("start-btn");
    video = document.getElementById("webcam-video");
    canvas = document.getElementById("canvas");
    ctx = canvas.getContext("2d");

    // 直接使用 onclick 事件監聽，確保百分之百捕捉 User Gesture
    startBtn.onclick = function() {
      startBtn.style.display = "none";
      document.getElementById("status").innerText = "正在請求相機權限...";

      // 1. 最原生的 getUserMedia
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 300, height: 300 },
        audio: false
      })
      .then(function(stream) {
        video.srcObject = stream;
        // 2. 原生 Video 標籤播放 (絕對不會被視為自動播放)
        return video.play();
      })
      .then(function() {
        canvas.width = 300;
        canvas.height = 300;
        document.getElementById("status").innerText = "相機已開啟，正在載入 AI 模型...";
        loadModel();
      })
      .catch(function(err) {
        document.getElementById("status").innerText = "相機啟動失敗: " + err.message;
      });
    };

    async function loadModel() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      try {
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        document.getElementById("status").innerText = "模型載入完成！偵測中...";
        requestAnimationFrame(loop);
      } catch (e) {
        document.getElementById("status").innerText = "模型載入失敗: " + e.message;
      }
    }

    async function loop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        await predict();
      }
      requestAnimationFrame(loop);
    }

    async function predict() {
      // 利用原生 video 影像直接餵給 estimatePose
      const { pose, posenetOutput } = await model.estimatePose(video);
      const prediction = await model.predict(posenetOutput);

      let highestPrediction = { className: "", probability: 0 };

      for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > highestPrediction.probability) {
          highestPrediction = {
            className: prediction[i].className,
            probability: prediction[i].probability
          };
        }
      }

      // 信心度大於 70% 傳回 App Inventor
      if (highestPrediction.probability > 0.70) {
        const resultText = highestPrediction.className + " (" + Math.round(highestPrediction.probability * 100) + "%)";
        if (resultText !== lastSentPrediction) {
          lastSentPrediction = resultText;
          if (window.AppInventor) {
            window.AppInventor.setWebViewString(resultText);
          }
        }
      }

      drawCanvas(pose);
    }

    function drawCanvas(pose) {
      // 將影片畫上 Canvas 並加上鏡頭水平翻轉 (前鏡頭效果)
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      if (pose) {
        const minPartConfidence = 0.5;
        // 由於做了鏡頭翻轉，畫骨架時用原始點位繪製即可
        tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
        tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
      }
    }
  </script>
</body>
</html>
