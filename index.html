<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Detection for App Inventor</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background: #000; color: #fff; font-family: sans-serif; }
    #webcam-video { display: none; } /* 隱藏原生 video，改畫在 Canvas 上 */
    #canvas { width: 100vw; max-width: 400px; height: auto; border-bottom: 2px solid #333; }
    #status { padding: 10px; font-size: 15px; color: #00ffcc; text-align: center; }
    #start-btn { width: 80%; padding: 15px; font-size: 18px; background-color: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; margin: 20px 0; cursor: pointer; }
  </style>
</head>
<body>

  <button id="start-btn">開啟相機與姿勢偵測</button>
  <div id="status">請點擊上方按鈕啟動</div>
  
  <video id="webcam-video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script type="text/javascript">
    // ⚠️ 記得替換成你在 Teachable Machine 匯出的模型網址 (包含結尾斜線 /)
    const URL = "https://teachablemachine.withgoogle.com/models/hx2CKcKZ2/";
    let model, video, canvas, ctx, maxPredictions;
    let lastSentAction = "";

    const startBtn = document.getElementById("start-btn");
    video = document.getElementById("webcam-video");
    canvas = document.getElementById("canvas");
    ctx = canvas.getContext("2d");

    // 點擊事件觸發相機與模型初始化
    startBtn.onclick = function() {
      startBtn.style.display = "none";
      document.getElementById("status").innerText = "正在請求相機權限...";

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: 300, height: 300 },
        audio: false
      })
      .then(function(stream) {
        video.srcObject = stream;
        return video.play(); // 原生 video 播放 (解決 play() 阻擋問題)
      })
      .then(function() {
	  
		video.width = 300;
		video.height = 300;
		canvas.width = 300;
		canvas.height = 300;
        
        document.getElementById("status").innerText = "相機已啟動，載入 AI 模型中...";
        loadModel();
      })
      .catch(function(err) {
        document.getElementById("status").innerText = "啟動失敗: " + err.message;
      });
    };

    async function loadModel() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      try {
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        document.getElementById("status").innerText = "模型載入成功，偵測中...";
        requestAnimationFrame(loop);
      } catch (e) {
        document.getElementById("status").innerText = "模型載入失敗: " + e.message;
      }
    }

    async function loop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        await predict();
      }
      requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(video);
      const prediction = await model.predict(posenetOutput);

      let highestPrediction = { className: "", probability: 0 };

      for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > highestPrediction.probability) {
          highestPrediction = {
            className: prediction[i].className,
            probability: prediction[i].probability
          };
        }
      }

      const currentProbability = Math.round(highestPrediction.probability * 100);

      // 當信心度 > 70% 時打包 JSON 傳送
      if (highestPrediction.probability > 0.70) {
        
        // 打包要傳給 App Inventor 的 JSON 資料物件
        const dataToSend = {
          action: highestPrediction.className, // 姿勢名稱 (例如 "Squat" 或 "Stand")
          probability: currentProbability,      // 信心度數字 (例如 95)
          timestamp: Date.now()                 // 時間戳記
        };

        // 避免重複連續傳送相同的動作 (可依需求調整發送邏輯)
        if (highestPrediction.className !== lastSentAction) {
          lastSentAction = highestPrediction.className;
          
          // 轉為 JSON 字串並傳送
          if (window.AppInventor) {
            window.AppInventor.setWebViewString(JSON.stringify(dataToSend));
          }
        }
      }

      drawCanvas(pose);
    }

	function drawCanvas(pose) {
  // 1. Draw camera video background onto canvas
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 2. Draw keypoints and skeleton directly
  if (pose && pose.keypoints) {
    const minPartConfidence = 0.5;

    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
  }
}
  </script>
</body>
</html>
