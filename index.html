<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background: #000; color: #fff; font-family: sans-serif; }
    #canvas { width: 100vw; max-width: 400px; height: auto; border-bottom: 2px solid #333; }
    #status { padding: 10px; font-size: 16px; color: #00ffcc; text-align: center; }
    #start-btn { padding: 14px 28px; font-size: 18px; background-color: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; margin: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <button id="start-btn" onclick="initCam()">開啟相機與姿態偵測</button>
  <div id="status">點擊上方按鈕啟動相機</div>
  <canvas id="canvas"></canvas>

  <script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/9GH08O2__/";
    
    let model, webcam, ctx, maxPredictions;
    let lastSentPrediction = "";

    // 關鍵修復：點擊事件觸發時，同步建立 video HTML 標籤並啟動
    function initCam() {
      document.getElementById("start-btn").style.display = "none";
      document.getElementById("status").innerText = "正在初始化鏡頭與載入模型...";

      const size = 300;
      const flip = true;
      webcam = new tmPose.Webcam(size, size, flip);

      // 同步設定鏡頭並播放 (不等待網絡加載，維持點擊事件的 Context)
      webcam.setup({ facingMode: "user" })
        .then(() => {
          return webcam.play(); // 權限啟動成功
        })
        .then(() => {
          const canvas = document.getElementById("canvas");
          canvas.width = size; canvas.height = size;
          ctx = canvas.getContext("2d");
          
          // 鏡頭啟動後，再同步載入模型
          loadModel();
        })
        .catch(err => {
          document.getElementById("status").innerText = "相機啟動失敗: " + err.message;
        });
    }

    async function loadModel() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      try {
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        document.getElementById("status").innerText = "模型載入完成，偵測中...";
        window.requestAnimationFrame(loop);
      } catch (e) {
        document.getElementById("status").innerText = "模型載入失敗: " + e.message;
      }
    }

    async function loop(timestamp) {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);

      let highestPrediction = { className: "", probability: 0 };

      for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > highestPrediction.probability) {
          highestPrediction = {
            className: prediction[i].className,
            probability: prediction[i].probability
          };
        }
      }

      if (highestPrediction.probability > 0.75) {
        const resultText = highestPrediction.className + " (" + Math.round(highestPrediction.probability * 100) + "%)";
        if (resultText !== lastSentPrediction) {
          lastSentPrediction = resultText;
          if (window.AppInventor) {
            window.AppInventor.setWebViewString(resultText);
          }
        }
      }

      drawCanvas(pose);
    }

    function drawCanvas(pose) {
      if (webcam.canvas) {
        ctx.drawImage(webcam.canvas, 0, 0);
        if (pose) {
          const minPartConfidence = 0.5;
          tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
          tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
        }
      }
    }
  </script>
</body>
</html>
